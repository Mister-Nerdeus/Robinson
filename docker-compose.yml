services:
  web:
    build:
      context: .
      args:
        RUNTIME_MODE: ${RUNTIME_MODE}
        SITE_URL: ${SITE_URL}
        LOCAL_ONLY_MODE: ${LOCAL_ONLY_MODE}
        ALLOW_ADMIN_OUTSIDE_LOCAL_MODE: ${ALLOW_ADMIN_OUTSIDE_LOCAL_MODE}
        ENABLE_ADMIN_SUBMISSIONS_REVIEW: ${ENABLE_ADMIN_SUBMISSIONS_REVIEW}
        REVIEW_SURFACES_VISIBLE: ${REVIEW_SURFACES_VISIBLE}
        REVIEW_ACCESS_KEY: ${REVIEW_ACCESS_KEY}
        REVIEW_ACCESS_COOKIE_NAME: ${REVIEW_ACCESS_COOKIE_NAME}
        DEPLOYMENT_STAMP_VISIBLE: ${DEPLOYMENT_STAMP_VISIBLE}
        DEPLOY_COMMIT_SHA: ${DEPLOY_COMMIT_SHA}
        DEPLOY_REF: ${DEPLOY_REF}
        DEPLOY_BUILD_TIME_UTC: ${DEPLOY_BUILD_TIME_UTC}
        SEO_ALLOW_INDEXING: ${SEO_ALLOW_INDEXING}
    container_name: robinson-main-web
    env_file:
      - .env.main
    ports:
      - "3010:4850"
    volumes:
      - main_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4850',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

volumes:
  main_data:
name: robinson-develop

services:
  web:
    build:
      context: .
      args:
        RUNTIME_MODE: ${RUNTIME_MODE}
        SITE_URL: ${SITE_URL}
        LOCAL_ONLY_MODE: ${LOCAL_ONLY_MODE}
        ALLOW_ADMIN_OUTSIDE_LOCAL_MODE: ${ALLOW_ADMIN_OUTSIDE_LOCAL_MODE}
        ENABLE_ADMIN_SUBMISSIONS_REVIEW: ${ENABLE_ADMIN_SUBMISSIONS_REVIEW}
        REVIEW_SURFACES_VISIBLE: ${REVIEW_SURFACES_VISIBLE}
        ADMIN_OWNER_TOKEN: ${ADMIN_OWNER_TOKEN}
        ADMIN_OPS_TOKEN: ${ADMIN_OPS_TOKEN}
        ADMIN_SESSION_COOKIE_NAME: ${ADMIN_SESSION_COOKIE_NAME}
        ENABLE_LOCAL_DEV_ADMIN_BYPASS: ${ENABLE_LOCAL_DEV_ADMIN_BYPASS}
        REVIEW_ALLOWED_HOSTS: ${REVIEW_ALLOWED_HOSTS}
        SUBMISSIONS_DB_PATH: ${SUBMISSIONS_DB_PATH}
        DEPLOYMENT_STAMP_VISIBLE: ${DEPLOYMENT_STAMP_VISIBLE}
        DEPLOY_COMMIT_SHA: ${DEPLOY_COMMIT_SHA}
        DEPLOY_REF: ${DEPLOY_REF}
        DEPLOY_BUILD_TIME_UTC: ${DEPLOY_BUILD_TIME_UTC}
        SEO_ALLOW_INDEXING: ${SEO_ALLOW_INDEXING}
        REQUEST_LAYOUT_CONTRACT_VERSION: ${REQUEST_LAYOUT_CONTRACT_VERSION}
        RATE_LIMIT_MODE: ${RATE_LIMIT_MODE}
        SUBMISSION_RETENTION_DAYS: ${SUBMISSION_RETENTION_DAYS}
        NOTIFICATION_MODE: ${NOTIFICATION_MODE}
        NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS}
        NOTIFICATION_INTERNAL_TO_EMAIL: ${NOTIFICATION_INTERNAL_TO_EMAIL}
        NOTIFICATION_TO_EMAIL: ${NOTIFICATION_TO_EMAIL}
        NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL}
        NOTIFICATION_FROM_NAME: ${NOTIFICATION_FROM_NAME}
        NOTIFICATION_REPLY_TO_EMAIL: ${NOTIFICATION_REPLY_TO_EMAIL}
        NOTIFICATION_LANE_TO_EMAIL_MAP: ${NOTIFICATION_LANE_TO_EMAIL_MAP}
        NOTIFICATION_SUBJECT_PREFIX: ${NOTIFICATION_SUBJECT_PREFIX}
        NOTIFICATION_DEVELOP_SAFE_INBOX_PATTERN: ${NOTIFICATION_DEVELOP_SAFE_INBOX_PATTERN}
        SMTP_PROFILE: ${SMTP_PROFILE}
        SMTP_HOST: ${SMTP_HOST}
        SMTP_PORT: ${SMTP_PORT}
        SMTP_USER: ${SMTP_USER}
        SMTP_PASS: ${SMTP_PASS}
        SMTP_SECURE: ${SMTP_SECURE}
        RESEND_API_KEY: ${RESEND_API_KEY}
        RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
    container_name: robinson-develop-web
    env_file:
      - .env.develop
    ports:
      - "3011:4850"
    volumes:
      - develop_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4850',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  api:
    image: axllent/mailpit:latest
    profiles: ["api"]
    ports:
      - "4001:8025"
      - "1026:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "version"]
      interval: 15s
      timeout: 5s
      retries: 4

  db:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_DB: robinson_test
      POSTGRES_USER: robinson
      POSTGRES_PASSWORD: robinson_test
    ports:
      - "5433:5432"
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robinson -d robinson_test"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  develop_data:
  test_pg_data:
